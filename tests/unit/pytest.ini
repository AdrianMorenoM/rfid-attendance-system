[pytest]
testpaths      = .
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    -q
    --strict-markers

markers =
    smoke:       pruebas contra servicios reales (requieren servicios activos)
    unit:        pruebas unitarias sin hardware ni red
    integration: pruebas de integración Flask con BD en memoria
