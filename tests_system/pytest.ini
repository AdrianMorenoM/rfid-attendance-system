[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short --strict-markers
junit_family = xunit2
markers =
    live: pruebas contra los servicios reales (solo lectura salvo las marcadas destructive)
    destructive: reinicios, kill -9, bloqueos de BD (requieren --destructive)
    hardware: lector RC522 real (requieren --hardware y --destructive)
    smoke: pruebas contra servicios reales (suite existente)
    unit: pruebas unitarias sin hardware ni red (suite existente)
    integration: pruebas de integracion Flask (suite existente)
