name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ADMIN_USER: admin
      ADMIN_PASSWORD: admin12345
      ALLOWED_SUBNET: disabled
      ALLOW_HTTP_MIGRATIONS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Correr tests
        run: |
          python -m pytest \
            shared/tests/test_reader.py \
            shared/tests/test_reader_extended.py \
            shared/tests/test_crud_api.py \
            shared/tests/test_dashboard_y_db.py \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            -v

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          