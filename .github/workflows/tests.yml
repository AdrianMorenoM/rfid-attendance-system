name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Instalar dependencias
        run: pip install -r requirements-ci.txt

      - name: Correr tests con cobertura
        env:
          ADMIN_USER: admin
          ADMIN_PASSWORD: test-admin-password
          ALLOWED_SUBNET: disabled
          ALLOW_HTTP_MIGRATIONS: "true"
        run: |
          python -m pytest shared/tests \
            --ignore=shared/tests/test_smoke.py \
            --tb=short \
            --cov=crud \
            --cov=dashboard \
            --cov=shared \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            -v

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

      - name: Resumen en GitHub
        if: always()
        run: |
          echo "## Resultados CI — Sistema RFID ITSOEH" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Python: 3.13" >> $GITHUB_STEP_SUMMARY
          echo "- Runner: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
